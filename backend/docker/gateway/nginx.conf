user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON formatted logging for analytics & monitoring
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"cf_connecting_ip":"$http_cf_connecting_ip",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.json json_analytics;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Real IP configuration for Cloudflare Tunnel
    # Uses CF-Connecting-IP header sent by Cloudflare Edge
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header CF-Connecting-IP;

    # Rate limiting: 60 requests/minute per client IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    upstream core_backend {
        server core-service:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name matchabaobei.stei.fun localhost;

        # Standard 429 JSON Error response
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Batas permintaan terlampaui (maksimum 60 req/menit). Silakan coba beberapa saat lagi."}}';
        }

        # Health endpoint without rate limit
        location = /api/v1/health {
            proxy_pass http://core_backend/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main API and documentation routing with rate limiting
        location / {
            limit_req zone=api_limit burst=10 nodelay;

            # CORS Preflight handling
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key, Accept' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            proxy_pass http://core_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffer tuning for low memory (STB HG680P)
            proxy_buffering on;
            proxy_buffers 8 8k;
            proxy_buffer_size 8k;
        }
    }
}
